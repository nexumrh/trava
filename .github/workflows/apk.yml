name: Gerar APK da trava

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexumcell.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nexumcell.jks" >> $GITHUB_ENV
            echo "assinado=sim" >> $GITHUB_OUTPUT
          else
            echo "assinado=nao" >> $GITHUB_OUTPUT
            echo "::warning::Sem a chave (secret KEYSTORE_BASE64): só testa a compilação, sem publicar o APK."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.chave.outputs.assinado }}" = "sim" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk nexumcell-trava.apk
          else
            gradle --no-daemon assembleDebug
          fi

      - name: SHA-256 da assinatura (para o QR code)
        if: steps.chave.outputs.assinado == 'sim'
        id: sha
        run: |
          HEX=$(keytool -printcert -jarfile nexumcell-trava.apk | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          B64=$(echo "$HEX" | tr -d ':' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          echo "hex=$HEX" >> $GITHUB_OUTPUT
          echo "b64=$B64" >> $GITHUB_OUTPUT

      - name: Publicar o APK (Release "latest")
        if: steps.chave.outputs.assinado == 'sim'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: NexumCell Trava v1.${{ github.run_number }}
          make_latest: true
          files: nexumcell-trava.apk
          body: |
            **Link do APK (Painel do Dono → Instalação do app):**
            https://github.com/${{ github.repository }}/releases/latest/download/nexumcell-trava.apk

            **SHA-256 da assinatura:**
            `${{ steps.sha.outputs.hex }}`
