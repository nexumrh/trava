name: Gerar APK da trava

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "assinado=nao" >> $GITHUB_OUTPUT
            echo "::warning::Sem a chave (secret KEYSTORE_BASE64): só testa a compilação, sem publicar o APK."
            exit 0
          fi
          # tira espaços e quebras de linha que vêm junto ao colar
          limpa() { printf '%s' "$1" | tr -d ' \t\r\n'; }
          SP=$(limpa "$KEYSTORE_PASSWORD"); KA=$(limpa "$KEY_ALIAS"); KP=$(limpa "$KEY_PASSWORD")
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/nexumcell.jks" || { echo "::error::KEYSTORE_BASE64 inválido: cole de novo TODO o conteúdo do KEYSTORE_BASE64.txt"; exit 1; }
          echo "Senha recebida: $(printf '%s' "$SP" | wc -c) caracteres, impressão $(printf '%s' "$SP" | sha256sum | cut -c1-8) (o certo é 20 caracteres, impressão ad5f1e42)"
          echo "Tamanho da chave: $(stat -c%s "$RUNNER_TEMP/nexumcell.jks") bytes (o certo é 2718)"
          if ! keytool -list -keystore "$RUNNER_TEMP/nexumcell.jks" -storepass "$SP" >/dev/null 2>&1; then
            if [ "$(stat -c%s "$RUNNER_TEMP/nexumcell.jks")" != "2718" ]; then
              echo "::error::O segredo KEYSTORE_BASE64 está incompleto ou errado. Apague e cole de novo TODO o conteúdo do arquivo KEYSTORE_BASE64.txt."
            else
              echo "::error::A senha do segredo KEYSTORE_PASSWORD está errada. Apague e crie de novo copiando a senha do SECRETS-GITHUB.txt."
            fi
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/nexumcell.jks" -storepass "$SP" -alias "$KA" >/dev/null 2>&1 || { echo "::error::O segredo KEY_ALIAS está errado (o certo é: nexumcell)."; exit 1; }
          { echo "KEYSTORE_FILE=$RUNNER_TEMP/nexumcell.jks"; echo "KEYSTORE_PASSWORD=$SP"; echo "KEY_ALIAS=$KA"; echo "KEY_PASSWORD=$KP"; } >> $GITHUB_ENV
          echo "assinado=sim" >> $GITHUB_OUTPUT

      - name: Compilar
        run: |
          if [ "${{ steps.chave.outputs.assinado }}" = "sim" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk nexumcell-trava.apk
          else
            gradle --no-daemon assembleDebug
          fi

      - name: SHA-256 da assinatura (para o QR code)
        if: steps.chave.outputs.assinado == 'sim'
        id: sha
        run: |
          # APK assinado só com v2/v3 não aparece no -printcert -jarfile: lê o certificado direto da chave
          HEX=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ' ')
          B64=$(echo "$HEX" | tr -d ':' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          echo "hex=$HEX" >> $GITHUB_OUTPUT
          echo "b64=$B64" >> $GITHUB_OUTPUT

      - name: Publicar o APK (Release "latest")
        if: steps.chave.outputs.assinado == 'sim'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: NexumCell Trava v1.${{ github.run_number }}
          make_latest: true
          files: nexumcell-trava.apk
          body: |
            **Link do APK (Painel do Dono → Instalação do app):**
            https://github.com/${{ github.repository }}/releases/latest/download/nexumcell-trava.apk

            **SHA-256 da assinatura:**
            `${{ steps.sha.outputs.hex }}`
