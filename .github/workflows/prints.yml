name: Prints do app (emulador)
on:
  push:
    branches: [prints-guia]
    paths: ['.github/prints.sh', '.github/prefs.py', '.github/workflows/prints.yml', 'app/**']
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador e prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/prints.sh
      - name: Salvar prints no branch
        if: always()
        run: |
          git config user.name "nexum-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f prints/ && git commit -m "Prints do app (emulador)" && git push || true
